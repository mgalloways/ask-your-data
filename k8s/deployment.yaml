apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-your-data
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ask-your-data
  template:
    metadata:
      labels:
        app: ask-your-data
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: app
          image: 554479277082.dkr.ecr.us-east-1.amazonaws.com/ask-your-data:514fe2e56ada014c94607b0ce605199f1fd275c7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3