name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Static security scan (Bandit)
        run: bandit -r app -ll

      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ask-your-data:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 ask-your-data:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health
