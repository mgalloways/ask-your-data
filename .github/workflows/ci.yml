name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Static security scan (Bandit)
        run: bandit -r app -ll

      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ask-your-data:${{ github.sha }} .

      - name: Scan image for vulnerablilities (Trivy)
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          ghcr.io/aquasecurity/trivy:0.69.2 image \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
          ask-your-data:${{ github.sha }}

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 ask-your-data:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health

  push:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::554479277082:role/github-ecr-push
          aws-region: us-east-1

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 554479277082.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and push
        run: |
          IMAGE=554479277082.dkr.ecr.us-east-1.amazonaws.com/ask-your-data:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"